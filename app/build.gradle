plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jlxc.uvcai'
    compileSdk 35


    lint {
        // 这是车机侧载 APK，不上架 Google Play。
        // targetSdk 28 是为了兼容 Android 10 车机的 USB 权限行为；
        // AGP 8 的 release 构建会把 targetSdk<33 当成 fatal lint，这里关闭该检查。
        abortOnError false
        checkReleaseBuilds false
        disable 'ExpiredTargetSdkVersion'
    }

    defaultConfig {
        applicationId "com.jlxc.usbcaerapro"
        minSdk 21
        targetSdk 28
        versionCode 13
        versionName "uvc-v13-lintfix"

        ndk {
            // 你的车机疑似 32 位，先只出 32 位 APK，避免装错 ABI。
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

// 解决 UVCAndroid 依赖链里 Kotlin 1.8.x 与旧 kotlin-stdlib-jdk7/jdk8 1.6.x 重复类冲突。
// 这个 App 本身是 Java 写的，不需要 appcompat。
configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation('com.herohan:UVCAndroid:1.0.12') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}
